<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" font-family="'Hiragino Sans', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#556274" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="620" fill="#ffffff" />

  <text x="520" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">RSS Security Dashboard — 構成図</text>

  <!-- Browser -->
  <rect x="30" y="240" width="150" height="90" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5" />
  <text x="105" y="278" text-anchor="middle" font-size="15" font-weight="600" fill="#3730a3">ブラウザ</text>
  <text x="105" y="298" text-anchor="middle" font-size="12" fill="#4338ca">(User Client)</text>

  <!-- Docker container boundary -->
  <rect x="240" y="80" width="560" height="470" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4" />
  <text x="260" y="105" font-size="13" font-weight="700" fill="#475569">Docker Container: rss-sec-dashboard-app</text>

  <!-- Express box -->
  <rect x="270" y="125" width="500" height="230" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
  <text x="290" y="150" font-size="14" font-weight="700" fill="#1d4ed8">Express (:4000)</text>

  <!-- Apollo Server sub-box -->
  <rect x="292" y="165" width="220" height="90" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2" />
  <text x="402" y="190" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">Apollo Server</text>
  <text x="402" y="208" text-anchor="middle" font-size="11" fill="#1e40af">GraphQL API</text>
  <text x="402" y="225" text-anchor="middle" font-size="11" fill="#1e40af">POST /graphql</text>
  <text x="402" y="242" text-anchor="middle" font-size="10" fill="#3b82f6">resolvers → service → repository</text>

  <!-- Static serving sub-box -->
  <rect x="528" y="165" width="222" height="90" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2" />
  <text x="639" y="190" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">静的配信</text>
  <text x="639" y="208" text-anchor="middle" font-size="11" fill="#1e40af">React (Vite build)</text>
  <text x="639" y="225" text-anchor="middle" font-size="11" fill="#1e40af">GET / , /assets/*</text>
  <text x="639" y="242" text-anchor="middle" font-size="10" fill="#3b82f6">frontend/dist (SPA fallback)</text>

  <!-- Feed fetch service -->
  <rect x="292" y="270" width="458" height="65" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2" />
  <text x="521" y="295" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">RssService — fetchFeeds()</text>
  <text x="521" y="315" text-anchor="middle" font-size="11" fill="#1e40af">rss-parser で外部フィードを取得・保存</text>

  <!-- Prisma box -->
  <rect x="270" y="375" width="500" height="70" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
  <text x="290" y="400" font-size="14" font-weight="700" fill="#15803d">Prisma Client (ORM)</text>
  <text x="290" y="420" font-size="11" fill="#166534">migrate deploy 済み / feeds・articles テーブル</text>

  <!-- SQLite box -->
  <rect x="270" y="470" width="230" height="60" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5" />
  <text x="385" y="495" text-anchor="middle" font-size="13" font-weight="700" fill="#854d0e">SQLite</text>
  <text x="385" y="513" text-anchor="middle" font-size="11" fill="#854d0e">data/dev.db</text>

  <!-- Volume box -->
  <rect x="540" y="470" width="230" height="60" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5" stroke-dasharray="4 3" />
  <text x="655" y="495" text-anchor="middle" font-size="13" font-weight="700" fill="#9d174d">Docker Volume</text>
  <text x="655" y="513" text-anchor="middle" font-size="11" fill="#9d174d">app_data → /app/backend/data</text>

  <!-- External RSS sources -->
  <rect x="850" y="255" width="160" height="90" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" />
  <text x="930" y="288" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">外部 RSS</text>
  <text x="930" y="308" text-anchor="middle" font-size="11" fill="#c2410c">セキュリティ</text>
  <text x="930" y="324" text-anchor="middle" font-size="11" fill="#c2410c">ニュースフィード</text>

  <!-- Arrows -->
  <!-- browser <-> express -->
  <line x1="180" y1="285" x2="268" y2="240" stroke="#556274" stroke-width="1.6" marker-end="url(#arrow)" />
  <line x1="268" y1="255" x2="180" y2="300" stroke="#556274" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="222" y="228" text-anchor="middle" font-size="10" fill="#334155">HTTP :4000</text>

  <!-- express -> prisma -->
  <line x1="521" y1="356" x2="521" y2="373" stroke="#556274" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- prisma -> sqlite -->
  <line x1="450" y1="446" x2="410" y2="468" stroke="#556274" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- sqlite -> volume (persisted) -->
  <line x1="500" y1="500" x2="538" y2="500" stroke="#556274" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#arrow)" />
  <text x="519" y="490" text-anchor="middle" font-size="9" fill="#334155">永続化</text>

  <!-- fetch service -> external rss -->
  <line x1="750" y1="302" x2="848" y2="300" stroke="#556274" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="800" y="292" text-anchor="middle" font-size="10" fill="#334155">HTTPS fetch</text>

  <!-- Legend -->
  <text x="260" y="575" font-size="11" fill="#64748b">実線: 同期呼び出し／同一コンテナ内　点線: 永続化・外部境界</text>
  <text x="260" y="595" font-size="11" fill="#64748b">docker compose up --build -d で起動、4000番ポートを公開</text>
</svg>
