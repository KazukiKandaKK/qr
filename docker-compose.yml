services:
  app:
    build: .
    container_name: rss-sec-dashboard-app
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: "file:/app/backend/data/dev.db"
      LOG_LEVEL: info
      LOG_FILE: "/app/backend/logs/app.log"
      CORS_ORIGIN: "false"
      JWT_SECRET: ${JWT_SECRET:?Please set JWT_SECRET in your environment or .env file}
    ports:
      - "4000:4000"
    volumes:
      - app_data:/app/backend/data
      - logs:/app/backend/logs

volumes:
  app_data:
  logs:
